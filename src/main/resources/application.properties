spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.port=8085

# Expose Prometheus endpoint
management.endpoints.web.exposure.include=prometheus,health,info

# Add application tag to all metrics
management.metrics.tags.application=mysampleapp

# Enable HTTP request timing histograms
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=1ms,5ms,10ms,50ms,100ms,200ms,500ms,1s,5s